histoire:
  texte: "Depuis 1985, Le club de tennis de Chusclan vous accueille pour découvrir le plaisir du sport à partager dans une ambiance familiale. Des cours sont proposés en semaine, et des compétitions loisirs et officielles sont disputées tout au long de l'année."

