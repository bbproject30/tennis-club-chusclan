prestations:
  - titre: "Cours enfants (6-12 ans)"
    description: "Mercredi après-midi, groupes de 6, encadré par un moniteur diplômé."
    tarif: "120€ / an"
  - titre: "Cours ados/adultes"
    description: "Cours collectifs le soir en semaine, tous niveaux."
    tarif: "180€ / an"
  - titre: "Compétition (équipes)"
    description: "Championnat départemental, entraînements dédiés le week-end."
    tarif: "Inclus dans l'adhésion compétiteur"
  - titre: "Adhésion loisir simple"
    description: "Accès libre aux courts en dehors des créneaux cours/compétition."
    tarif: "90€ / an"

histoire:
  texte: "Depuis le 4 novembre 2011, Le club de tennis de Chusclan vous accueille pour découvrir le plaisir du sport à partager dans une ambiance familiale. Des cours sont proposés en semaine, et des compétitions loisirs et officielles sont disputées tout au long de l'année."

