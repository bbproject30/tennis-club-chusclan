{% extends "base.html" %}
{% block title %}{{ config.nom_club }} — Actualités{% endblock %}

{% block content %}
<section>
  <h2>Actualités</h2>
  <p>Suivez toute la vie du club (photos, résultats, événements) directement depuis notre page Facebook.</p>

  <div class="fb-feed-container">
    <iframe
      src="https://www.facebook.com/plugins/page.php?href={{ config.reseaux_sociaux.facebook | urlencode }}&tabs=timeline&width=500&height=700&small_header=false&adapt_container_width=true&hide_cover=false&show_facepile=true"
      width="500"
      height="700"
      style="border:none;overflow:hidden;"
      scrolling="no"
      frameborder="0"
      allowfullscreen="true"
      allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
    </iframe>
  </div>

  <p class="fallback-lien">
    Le flux ne s'affiche pas ? <a href="{{ config.reseaux_sociaux.facebook }}" target="_blank">Voir directement sur Facebook <i class="fa-brands fa-facebook"></i></a>
  </p>
</section>
{% endblock %}
